<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Field</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b0e;
      --surface: #16151a;
      --surface-2: #1e1d23;
      --text: #c8c4c0;
      --text-bright: #ebe8e5;
      --muted: #5e5b56;
      --dim: #3a3a3e;
      --line: rgba(255,255,255,0.04);
      --ring: rgba(255,255,255,0.06);
      --node: #c9b88a;
      --node-dim: rgba(201,184,138,0.35);
      --smooth: #5d9e72;
      --near: #8e9e5d;
      --stretch: #c9a040;
      --jump: #b85555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); }
    body {
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 80px;
      max-width: 800px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.1s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    header { text-align: center; margin-bottom: 44px; }
    .build-tag { color: var(--dim); margin-bottom: 10px; display: block; }
    h1 {
      font-weight: 500;
      font-size: 30px;
      letter-spacing: -0.025em;
      color: var(--text-bright);
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
      max-width: 380px;
      margin: 0 auto;
    }

    .field-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 28px;
      position: relative;
    }
    .field-container svg { width: 100%; height: auto; display: block; }

    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--dim);
    }
    .legend-swatch {
      width: 16px;
      height: 2px;
      border-radius: 1px;
    }

    .readings {
      display: flex;
      gap: 36px;
      justify-content: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .reading { text-align: center; }
    .reading .r-label { display: block; color: var(--muted); margin-bottom: 5px; }
    .reading .r-value {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-bright);
    }

    .curves {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .curve { display: flex; align-items: center; gap: 12px; }
    .curve-label { width: 50px; text-align: right; flex-shrink: 0; color: var(--dim); }
    .curve svg { flex: 1; height: 48px; display: block; }

    .setlist-section {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }
    .sl-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sl-heading { color: var(--dim); }
    .sl-actions { display: flex; gap: 8px; }
    .sl-row {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      gap: 8px;
      border-radius: 5px;
      transition: background 0.15s;
      position: relative;
    }
    .sl-row:hover, .sl-row.active { background: var(--surface); }
    .sl-num { width: 18px; text-align: right; color: var(--dim); flex-shrink: 0; }
    .sl-name { flex: 1; font-size: 14px; color: var(--text); cursor: pointer; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sl-key { color: var(--muted); width: 30px; text-align: center; flex-shrink: 0; }
    .sl-bpm { color: var(--dim); width: 36px; text-align: right; flex-shrink: 0; }
    .sl-bar-wrap {
      width: 44px;
      height: 3px;
      background: var(--surface-2);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sl-bar { height: 100%; border-radius: 2px; }
    .sl-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sl-row:hover .sl-controls { opacity: 1; }
    .sl-btn {
      background: none;
      border: 1px solid var(--dim);
      color: var(--muted);
      width: 22px;
      height: 22px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.15s, color 0.15s;
      padding: 0;
    }
    .sl-btn:hover { border-color: var(--node); color: var(--text-bright); }
    .sl-btn.sl-remove:hover { border-color: var(--jump); color: var(--jump); }
    .sl-trans {
      display: flex;
      align-items: center;
      padding: 3px 0 3px 38px;
      gap: 6px;
    }
    .sl-arrow { color: var(--dim); font-size: 10px; }
    .sl-badge { font-size: 10px; padding: 1px 7px; border-radius: 3px; }
    .q-smooth { background: rgba(93,158,114,0.12); color: var(--smooth); }
    .q-near { background: rgba(142,158,93,0.12); color: var(--near); }
    .q-stretch { background: rgba(201,160,64,0.12); color: var(--stretch); }
    .q-jump { background: rgba(184,85,85,0.15); color: var(--jump); }

    /* Add form */
    .add-form {
      margin-top: 16px;
      padding: 14px 12px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .add-form.open { display: flex; }
    .af-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .af-input, .af-select {
      background: var(--bg);
      border: 1px solid var(--dim);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .af-input:focus, .af-select:focus { border-color: var(--node); }
    .af-input::placeholder { color: var(--dim); }
    .af-title { flex: 1; min-width: 120px; }
    .af-select { min-width: 64px; }
    .af-bpm { width: 70px; }
    .af-energy-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .af-energy-label { color: var(--dim); white-space: nowrap; }
    .af-energy {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 3px;
      background: var(--dim);
      border-radius: 2px;
      outline: none;
    }
    .af-energy::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--node);
      cursor: pointer;
    }
    .af-energy-val { color: var(--muted); width: 16px; text-align: center; }
    .btn {
      background: none;
      border: 1px solid var(--dim);
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--node); color: var(--text-bright); }
    .btn-primary {
      border-color: var(--node);
      color: var(--node);
    }
    .btn-primary:hover {
      background: rgba(201,184,138,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--dim);
      font-size: 14px;
    }

    /* Detail panel */
    .detail-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 18px 24px 16px;
      max-width: 380px;
      width: calc(100% - 40px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .detail-panel.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .dp-title { font-size: 16px; font-weight: 500; color: var(--text-bright); margin-bottom: 6px; }
    .dp-meta { display: flex; gap: 16px; margin-bottom: 14px; color: var(--muted); }
    .dp-conns { display: flex; flex-direction: column; gap: 7px; }
    .dp-conn { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .dp-dir { color: var(--dim); width: 30px; }
    .dp-conn-name { flex: 1; }
    .dp-close {
      position: absolute;
      top: 14px; right: 16px;
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
    }
    .dp-close:hover { color: var(--text); }

    @media (max-width: 560px) {
      body { padding: 24px 16px 80px; }
      h1 { font-size: 24px; }
      .readings { gap: 20px; }
      .reading .r-value { font-size: 15px; }
      .legend { gap: 10px; }
      .sl-controls { opacity: 1; }
      .af-row { gap: 6px; }
    }
  </style>
</head>
<body>

  <header>
    <span class="build-tag mono">015 · Night Lab</span>
    <h1>Set Field</h1>
    <p class="subtitle">See how your setlist moves through harmonic space. Add songs, reorder, and watch the field reshape.</p>
  </header>

  <div class="field-container">
    <svg id="field" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Setlist harmonic field"></svg>
  </div>

  <div class="legend" id="legend"></div>
  <div class="readings" id="readings"></div>
  <div class="curves" id="curves"></div>
  <div class="setlist-section" id="setlist-section"></div>

  <div class="detail-panel" id="detail-panel">
    <button class="dp-close" id="dp-close" aria-label="Close">&times;</button>
    <div class="dp-title" id="dp-title"></div>
    <div class="dp-meta mono" id="dp-meta"></div>
    <div class="dp-conns" id="dp-conns"></div>
  </div>

<script>
// ── Data ──────────────────────────────────────────────
const CIRCLE = ['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];

const REL_MAJOR = {
  'A':'C','E':'G','B':'D','F♯':'A','C♯':'E','G♯':'B',
  'D':'F','G':'B♭','C':'E♭','F':'A♭','B♭':'D♭','E♭':'F♯'
};

const DEMO_SONGS = [
  { title:'Morning Light', key:'C', minor:false, bpm:118, energy:6 },
  { title:'Hollow Ground', key:'A', minor:true,  bpm:96,  energy:4 },
  { title:'Voltage',       key:'E', minor:false, bpm:142, energy:9 },
  { title:'Paper Walls',   key:'G', minor:false, bpm:112, energy:5 },
  { title:'Undertow',      key:'D', minor:true,  bpm:86,  energy:3 },
  { title:'Bright Wreck',  key:'A', minor:false, bpm:132, energy:8 },
  { title:'Still Water',   key:'F', minor:false, bpm:74,  energy:2 },
  { title:'Burning Maps',  key:'B', minor:true,  bpm:146, energy:10 },
  { title:'Ghost Light',   key:'E', minor:true,  bpm:106, energy:5 },
  { title:'End Credits',   key:'C', minor:false, bpm:70,  energy:1 },
];

let nextId = 1;
let songs = [];
let firstRender = true;
let activeId = null;

function initSongs(data) {
  songs = data.map(s => ({ ...s, _id: nextId++ }));
}

// Key options for the dropdown
const MAJOR_KEYS = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MINOR_KEYS = ['Am','B♭m','Bm','Cm','C♯m','Dm','E♭m','Em','Fm','F♯m','Gm','G♯m'];

function parseKeyValue(val) {
  if (val.endsWith('m')) return { key: val.slice(0, -1), minor: true };
  return { key: val, minor: false };
}

// ── Geometry ──────────────────────────────────────────
const CX = 320, CY = 316;
const R_OUTER = 248, R_MAJOR = 198, R_MINOR = 152;

function kIdx(key, minor) {
  const k = minor ? REL_MAJOR[key] : key;
  const i = CIRCLE.indexOf(k);
  return i >= 0 ? i : 0;
}
function ang(i) { return (i * 30) * Math.PI / 180; }
function pt(a, r) { return { x: CX + r * Math.sin(a), y: CY - r * Math.cos(a) }; }
function kDist(a, b) { const d = Math.abs(a - b); return Math.min(d, 12 - d); }
function quality(d) {
  if (d <= 1) return { label:'Smooth', cls:'q-smooth', color:'#5d9e72' };
  if (d === 2) return { label:'Near', cls:'q-near', color:'#8e9e5d' };
  if (d === 3) return { label:'Stretch', cls:'q-stretch', color:'#c9a040' };
  return { label:'Jump', cls:'q-jump', color:'#b85555' };
}
function kLabel(s) { return s.minor ? s.key + 'm' : s.key; }
function nRadius(s) { return 8 + (s.energy / 10) * 10; }

function computePositions() {
  const groups = {};
  songs.forEach(s => {
    const i = kIdx(s.key, s.minor);
    const ring = s.minor ? 'min' : 'maj';
    const k = i + '-' + ring;
    (groups[k] = groups[k] || []).push(s);
  });
  const out = {};
  for (const [k, group] of Object.entries(groups)) {
    const [iStr, ring] = k.split('-');
    const baseA = ang(+iStr);
    const r = ring === 'min' ? R_MINOR : R_MAJOR;
    const spread = 15 * Math.PI / 180;
    group.forEach((s, j) => {
      const offset = (j - (group.length - 1) / 2) * spread;
      out[s._id] = pt(baseA + offset, r);
    });
  }
  return out;
}

// ── SVG helper ────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, styles) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (styles) for (const [k, v] of Object.entries(styles)) e.style[k] = v;
  return e;
}

// ── Render All ────────────────────────────────────────
function renderAll() {
  closeDetail();
  renderField();
  renderLegend();
  renderReadings();
  renderCurves();
  renderSetlist();
  firstRender = false;
}

function renderField() {
  const svg = document.getElementById('field');
  svg.innerHTML = '';
  if (songs.length === 0) return;

  const P = computePositions();

  // Rings + spokes
  [R_MAJOR, R_MINOR].forEach(r =>
    svg.appendChild(el('circle', { cx:CX, cy:CY, r }, { fill:'none', stroke:'rgba(255,255,255,0.05)', strokeWidth:'1' }))
  );
  for (let i = 0; i < 12; i++) {
    const a = ang(i);
    const p1 = pt(a, R_MINOR - 12), p2 = pt(a, R_MAJOR + 12);
    svg.appendChild(el('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y }, { stroke:'rgba(255,255,255,0.025)', strokeWidth:'1' }));
  }

  // Key labels
  CIRCLE.forEach((key, i) => {
    const p = pt(ang(i), R_OUTER + 4);
    const t = el('text', { x:p.x, y:p.y, 'text-anchor':'middle', 'dominant-baseline':'central' },
      { fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', fill:'rgba(255,255,255,0.18)', letterSpacing:'0.02em' });
    t.textContent = key;
    svg.appendChild(t);
  });

  // Path segments
  const pathEls = [];
  for (let i = 0; i < songs.length - 1; i++) {
    const s1 = songs[i], s2 = songs[i + 1];
    const p1 = P[s1._id], p2 = P[s2._id];
    if (!p1 || !p2) continue;
    const d = kDist(kIdx(s1.key, s1.minor), kIdx(s2.key, s2.minor));
    const q = quality(d);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dx = mx - CX, dy = my - CY;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const bend = 12 + d * 6;
    const path = el('path', {
      d: `M${p1.x},${p1.y} Q${mx + (dx/len)*bend},${my + (dy/len)*bend} ${p2.x},${p2.y}`
    }, { fill:'none', stroke:q.color, strokeWidth:'1.5', strokeLinecap:'round', opacity:'0.55' });
    svg.appendChild(path);
    pathEls.push(path);
  }

  // Animate on first render only
  if (firstRender) {
    requestAnimationFrame(() => {
      pathEls.forEach((p, i) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        p.style.transition = `stroke-dashoffset 0.5s ease ${0.15 + i * 0.1}s`;
        requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; });
      });
    });
  }

  // Song nodes
  songs.forEach((s, i) => {
    const p = P[s._id];
    if (!p) return;
    const r = nRadius(s);

    svg.appendChild(el('circle', { cx:p.x, cy:p.y, r:r+8 }, { fill:'rgba(201,184,138,0.04)' }));

    const node = el('circle', { cx:p.x, cy:p.y, r, 'data-id':s._id },
      { fill: s.minor ? 'rgba(201,184,138,0.35)' : '#c9b88a', cursor:'pointer', transition:'filter 0.15s' });
    node.addEventListener('mouseenter', () => { node.style.filter = 'brightness(1.25)'; highlightRow(s._id); });
    node.addEventListener('mouseleave', () => { node.style.filter = ''; highlightRow(null); });
    node.addEventListener('click', (e) => { e.stopPropagation(); showDetail(s._id); });
    svg.appendChild(node);

    const num = el('text', { x:p.x, y:p.y, 'text-anchor':'middle', 'dominant-baseline':'central' },
      { fontFamily:"'JetBrains Mono',monospace", fontSize:'9px', fill:'#0c0b0e', fontWeight:'500', pointerEvents:'none' });
    num.textContent = i + 1;
    svg.appendChild(num);

    const label = el('text', { x:p.x, y:p.y + r + 14, 'text-anchor':'middle' },
      { fontFamily:"'Geist',system-ui,sans-serif", fontSize:'10px', fill:'rgba(200,196,192,0.7)', pointerEvents:'none' });
    label.textContent = s.title;
    svg.appendChild(label);

    const crowded = songs.some(o => o._id !== s._id && P[o._id] &&
      Math.hypot(P[o._id].x - p.x, P[o._id].y - p.y) < 55);
    if (!crowded) {
      const kb = el('text', { x:p.x, y:p.y + r + 25, 'text-anchor':'middle' },
        { fontFamily:"'JetBrains Mono',monospace", fontSize:'8px', fill:'rgba(255,255,255,0.12)', pointerEvents:'none' });
      kb.textContent = kLabel(s);
      svg.appendChild(kb);
    }
  });
}

// ── Legend ─────────────────────────────────────────────
function renderLegend() {
  document.getElementById('legend').innerHTML = [
    { l:'Smooth (0–1)', c:'#5d9e72' },
    { l:'Near (2)', c:'#8e9e5d' },
    { l:'Stretch (3)', c:'#c9a040' },
    { l:'Jump (4+)', c:'#b85555' },
  ].map(i => `<div class="legend-item mono"><span class="legend-swatch" style="background:${i.c}"></span><span>${i.l}</span></div>`)
  .join('') + `<div class="legend-item mono" style="gap:4px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9b88a;opacity:0.5"></span><span>Size = energy</span></div>`;
}

// ── Readings ──────────────────────────────────────────
function renderReadings() {
  const c = document.getElementById('readings');
  if (songs.length < 2) { c.innerHTML = ''; return; }

  let total = 0, smoothN = 0, worstI = 0, worstD = 0;
  for (let i = 0; i < songs.length - 1; i++) {
    const d = kDist(kIdx(songs[i].key, songs[i].minor), kIdx(songs[i+1].key, songs[i+1].minor));
    total += d;
    if (d <= 1) smoothN++;
    if (d > worstD) { worstD = d; worstI = i; }
  }
  const avg = total / (songs.length - 1);
  const cohesion = Math.max(0, ((1 - avg / 6) * 10)).toFixed(1);

  c.innerHTML = `
    <div class="reading">
      <span class="r-label mono">Harmonic cohesion</span>
      <span class="r-value">${cohesion} <span style="color:var(--dim);font-size:13px">/ 10</span></span>
    </div>
    <div class="reading">
      <span class="r-label mono">Smooth transitions</span>
      <span class="r-value">${smoothN} <span style="color:var(--dim);font-size:13px">of ${songs.length - 1}</span></span>
    </div>
    <div class="reading">
      <span class="r-label mono">Biggest jump</span>
      <span class="r-value" style="font-size:14px">${kLabel(songs[worstI])} → ${kLabel(songs[worstI+1])} · ${worstD} steps</span>
    </div>`;
}

// ── Curves ────────────────────────────────────────────
function renderCurves() {
  const c = document.getElementById('curves');
  if (songs.length < 2) { c.innerHTML = ''; return; }
  const W = 440, H = 52, PAD = 16;

  function spark(values, max, color, label) {
    const step = (W - PAD * 2) / (values.length - 1);
    const pts = values.map((v, i) => ({ x: PAD + i * step, y: H - 10 - ((v / max) * (H - 20)) }));
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const cp = (pts[i-1].x + pts[i].x) / 2;
      d += ` C${cp},${pts[i-1].y} ${cp},${pts[i].y} ${pts[i].x},${pts[i].y}`;
    }
    const dots = pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="${color}" opacity="0.7"/>`).join('');
    const nums = pts.map((p, i) => `<text x="${p.x}" y="${H-1}" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:rgba(255,255,255,0.1)">${i+1}</text>`).join('');
    return `<div class="curve"><span class="curve-label mono">${label}</span>
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.45"/>${dots}${nums}
      </svg></div>`;
  }

  c.innerHTML = spark(songs.map(s => s.energy), 10, '#c9b88a', 'Energy') +
                spark(songs.map(s => s.bpm), 160, '#5e5b56', 'Tempo');
}

// ── Linear setlist ────────────────────────────────────
function renderSetlist() {
  const c = document.getElementById('setlist-section');

  let h = `<div class="sl-header">
    <span class="sl-heading mono">Setlist Order</span>
    <div class="sl-actions">
      <button class="btn mono" onclick="toggleAddForm()" id="add-toggle">+ Add</button>
      <button class="btn mono" onclick="resetDemo()">Reset</button>
    </div>
  </div>`;

  if (songs.length === 0) {
    h += '<div class="empty-state">No songs yet. Add one to begin.</div>';
  }

  songs.forEach((s, i) => {
    h += `<div class="sl-row" data-sid="${s._id}">
      <span class="sl-num mono">${i + 1}</span>
      <span class="sl-name" onclick="showDetail(${s._id})">${s.title}</span>
      <span class="sl-key mono">${kLabel(s)}</span>
      <span class="sl-bpm mono">${s.bpm}</span>
      <div class="sl-bar-wrap"><div class="sl-bar" style="width:${s.energy*10}%;background:${s.minor?'rgba(201,184,138,0.35)':'#c9b88a'}"></div></div>
      <div class="sl-controls">
        ${i > 0 ? `<button class="sl-btn mono" onclick="moveSong(${s._id},-1)" title="Move up">↑</button>` : '<span style="width:22px"></span>'}
        ${i < songs.length - 1 ? `<button class="sl-btn mono" onclick="moveSong(${s._id},1)" title="Move down">↓</button>` : '<span style="width:22px"></span>'}
        <button class="sl-btn sl-remove mono" onclick="removeSong(${s._id})" title="Remove">×</button>
      </div>
    </div>`;

    if (i < songs.length - 1) {
      const next = songs[i + 1];
      const d = kDist(kIdx(s.key, s.minor), kIdx(next.key, next.minor));
      const q = quality(d);
      h += `<div class="sl-trans"><span class="sl-arrow mono">↓</span><span class="sl-badge mono ${q.cls}">${q.label} · ${d} step${d!==1?'s':''}</span></div>`;
    }
  });

  // Add form
  h += `<div class="add-form" id="add-form">
    <div class="af-row">
      <input type="text" class="af-input af-title" id="af-title" placeholder="Song title" maxlength="40">
      <select class="af-input af-select" id="af-key">
        <option value="">Key</option>
        <optgroup label="Major">${MAJOR_KEYS.map(k => `<option value="${k}">${k}</option>`).join('')}</optgroup>
        <optgroup label="Minor">${MINOR_KEYS.map(k => `<option value="${k}">${k}</option>`).join('')}</optgroup>
      </select>
    </div>
    <div class="af-row">
      <input type="number" class="af-input af-bpm" id="af-bpm" placeholder="BPM" min="40" max="260" step="1">
      <div class="af-energy-wrap">
        <span class="af-energy-label mono">Energy</span>
        <input type="range" class="af-energy" id="af-energy" min="1" max="10" value="5">
        <span class="af-energy-val mono" id="af-energy-val">5</span>
      </div>
      <button class="btn btn-primary mono" onclick="addSong()">Add</button>
    </div>
  </div>`;

  c.innerHTML = h;

  // Energy slider live update
  const slider = document.getElementById('af-energy');
  const valSpan = document.getElementById('af-energy-val');
  if (slider) slider.addEventListener('input', () => { valSpan.textContent = slider.value; });
}

// ── Actions ───────────────────────────────────────────
function addSong() {
  const title = document.getElementById('af-title').value.trim();
  const keyVal = document.getElementById('af-key').value;
  const bpm = parseInt(document.getElementById('af-bpm').value);
  const energy = parseInt(document.getElementById('af-energy').value);

  if (!title || !keyVal || isNaN(bpm)) return;

  const { key, minor } = parseKeyValue(keyVal);
  songs.push({ _id: nextId++, title, key, minor, bpm: Math.max(40, Math.min(260, bpm)), energy });
  renderAll();

  // Re-open form and clear
  const form = document.getElementById('add-form');
  if (form) form.classList.add('open');
}

function removeSong(id) {
  songs = songs.filter(s => s._id !== id);
  renderAll();
}

function moveSong(id, dir) {
  const i = songs.findIndex(s => s._id === id);
  const j = i + dir;
  if (j < 0 || j >= songs.length) return;
  [songs[i], songs[j]] = [songs[j], songs[i]];
  renderAll();
}

function resetDemo() {
  nextId = 1;
  initSongs(DEMO_SONGS);
  firstRender = false;
  renderAll();
}

function toggleAddForm() {
  const form = document.getElementById('add-form');
  if (form) form.classList.toggle('open');
}

// ── Detail panel ──────────────────────────────────────
function showDetail(id) {
  const s = songs.find(x => x._id === id);
  if (!s) return;
  activeId = id;
  const si = songs.indexOf(s);

  document.getElementById('dp-title').textContent = s.title;
  document.getElementById('dp-meta').innerHTML =
    `<span>${kLabel(s)}</span><span>${s.bpm} BPM</span><span>Energy ${s.energy}/10</span>`;

  let ch = '';
  if (si > 0) {
    const prev = songs[si - 1];
    const d = kDist(kIdx(prev.key, prev.minor), kIdx(s.key, s.minor));
    const q = quality(d);
    ch += `<div class="dp-conn"><span class="dp-dir mono">From</span><span class="dp-conn-name">${prev.title} (${kLabel(prev)})</span><span class="mono ${q.cls}" style="font-size:11px">${q.label}</span></div>`;
  }
  if (si < songs.length - 1) {
    const next = songs[si + 1];
    const d = kDist(kIdx(s.key, s.minor), kIdx(next.key, next.minor));
    const q = quality(d);
    ch += `<div class="dp-conn"><span class="dp-dir mono">To</span><span class="dp-conn-name">${next.title} (${kLabel(next)})</span><span class="mono ${q.cls}" style="font-size:11px">${q.label}</span></div>`;
  }
  document.getElementById('dp-conns').innerHTML = ch;
  document.getElementById('detail-panel').classList.add('visible');
  document.querySelectorAll('.sl-row').forEach(r => r.classList.toggle('active', +r.dataset.sid === id));
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  document.querySelectorAll('.sl-row').forEach(r => r.classList.remove('active'));
  activeId = null;
}

function highlightRow(id) {
  if (activeId) return;
  document.querySelectorAll('.sl-row').forEach(r =>
    r.style.background = (+r.dataset.sid === id) ? 'var(--surface)' : '');
}

function highlightNode(id) {
  if (activeId) return;
  document.querySelectorAll('[data-id]').forEach(n => {
    if (n.tagName === 'circle' && n.style.cursor === 'pointer')
      n.style.filter = (+n.dataset.id === id) ? 'brightness(1.25)' : '';
  });
}

document.getElementById('dp-close').addEventListener('click', closeDetail);
document.addEventListener('click', (e) => {
  if (activeId && !e.target.closest('.detail-panel') && !e.target.closest('[data-id]') && !e.target.closest('.sl-row'))
    closeDetail();
});

// ── Init ──────────────────────────────────────────────
initSongs(DEMO_SONGS);
renderAll();
</script>
</body>
</html>
