<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threshold Atlas</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --surface: rgba(255, 255, 255, 0.58);
      --surface-strong: rgba(255, 255, 255, 0.82);
      --line: rgba(17, 17, 17, 0.12);
      --text: #111111;
      --muted: #68625b;
      --soft: #8e877f;
      --accent: #8f6a36;
      --accent-soft: rgba(143, 106, 54, 0.16);
      --danger: #8d4f39;
      --danger-soft: rgba(141, 79, 57, 0.15);
      --ok: #526a4d;
      --ok-soft: rgba(82, 106, 77, 0.14);
      --shadow: 0 28px 80px rgba(40, 32, 20, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.84), transparent 38%),
        linear-gradient(180deg, #f7f3ed 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Geist", "Inter", system-ui, sans-serif;
    }

    body {
      padding: 18px;
      letter-spacing: -0.01em;
    }

    .frame {
      max-width: 1540px;
      margin: 0 auto;
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
    }

    .map-shell,
    .ledger-shell {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .map-shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      padding: 18px 18px 16px;
      gap: 16px;
    }

    .ledger-shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      padding: 18px;
      gap: 16px;
    }

    .eyebrow,
    .metric-label,
    .mini-note,
    .chip,
    .ledger-head,
    .toggle {
      font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace;
      letter-spacing: 0.02em;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .eyebrow {
      font-size: 11px;
      color: var(--soft);
      text-transform: uppercase;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      margin-top: 6px;
      font-size: clamp(28px, 4.2vw, 52px);
      line-height: 0.95;
      font-weight: 500;
      max-width: 12ch;
    }

    .header-copy {
      display: grid;
      gap: 10px;
      max-width: 560px;
    }

    .header-copy p {
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
      max-width: 48ch;
    }

    .control-stack {
      display: grid;
      gap: 10px;
      justify-items: end;
      padding-top: 2px;
    }

    .toggle-row,
    .scrubber {
      display: inline-flex;
      gap: 6px;
      border: 1px solid var(--line);
      padding: 4px;
      background: rgba(255,255,255,0.6);
    }

    .toggle {
      border: 0;
      background: transparent;
      padding: 8px 12px;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle.active {
      color: var(--text);
      background: rgba(17,17,17,0.06);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 14px 14px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.38);
      display: grid;
      gap: 10px;
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--soft);
    }

    .metric-value {
      font-size: 26px;
      line-height: 1;
      font-weight: 500;
    }

    .metric-note {
      font-size: 13px;
      line-height: 1.42;
      color: var(--muted);
    }

    .map-stage {
      min-height: 0;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.48), rgba(255,255,255,0.18)),
        rgba(255,255,255,0.18);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(17,17,17,0.08);
      background: rgba(255,255,255,0.28);
    }

    .stage-head h2,
    .ledger-headline h2 {
      font-size: 14px;
      font-weight: 500;
    }

    .mini-note {
      font-size: 11px;
      color: var(--soft);
      text-transform: uppercase;
    }

    .map-wrap {
      min-height: 0;
      padding: 10px;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 620px;
      overflow: visible;
      display: block;
    }

    .grid-line {
      stroke: rgba(17,17,17,0.07);
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .axis-label {
      fill: var(--soft);
      font-size: 11px;
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .band {
      fill: rgba(17,17,17,0.025);
    }

    .node {
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .node:hover {
      transform: translateY(-2px);
    }

    .node circle.core {
      fill: rgba(255,255,255,0.92);
      stroke-width: 1.4;
    }

    .node text {
      fill: var(--text);
      font-size: 12px;
    }

    .node .sub {
      fill: var(--muted);
      font-size: 11px;
      font-family: "JetBrains Mono", monospace;
    }

    .link {
      fill: none;
      stroke: rgba(17,17,17,0.14);
      stroke-width: 1.2;
    }

    .threshold-line {
      stroke: rgba(17,17,17,0.24);
      stroke-width: 1;
      stroke-dasharray: 5 7;
    }

    .active-node circle.core,
    .node:hover circle.core {
      stroke-width: 2;
    }

    .ledger-headline {
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .legend {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.38);
      padding: 12px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .swatch {
      width: 24px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(17,17,17,0.08);
    }

    .ledger {
      overflow: auto;
      display: grid;
      gap: 0;
      min-height: 0;
    }

    .ledger-entry {
      padding: 16px 0;
      border-top: 1px solid rgba(17,17,17,0.08);
      display: grid;
      gap: 10px;
      cursor: pointer;
      transition: background 180ms ease;
    }

    .ledger-entry:first-child { border-top: 0; }
    .ledger-entry:hover,
    .ledger-entry.active {
      background: rgba(17,17,17,0.03);
    }

    .ledger-entry-inner {
      padding: 0 2px;
      display: grid;
      gap: 10px;
    }

    .ledger-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 10px;
      color: var(--soft);
      text-transform: uppercase;
    }

    .ledger-entry strong {
      font-size: 15px;
      font-weight: 500;
    }

    .ledger-entry p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid rgba(17,17,17,0.08);
      padding: 4px 7px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .detail {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding-top: 4px;
    }

    .detail-card {
      border-top: 1px solid rgba(17,17,17,0.08);
      padding-top: 8px;
      display: grid;
      gap: 4px;
    }

    .detail-card span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--soft);
      font-family: "JetBrains Mono", monospace;
    }

    .detail-card strong,
    .detail-card p {
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
      color: var(--text);
    }

    @media (max-width: 1180px) {
      .frame {
        grid-template-columns: 1fr;
      }

      .ledger-shell {
        min-height: 0;
      }
    }

    @media (max-width: 840px) {
      body {
        padding: 12px;
      }

      .frame {
        min-height: calc(100vh - 24px);
      }

      .map-shell,
      .ledger-shell {
        padding: 16px;
      }

      .header {
        flex-direction: column;
      }

      .control-stack {
        justify-items: start;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      svg {
        min-height: 520px;
      }
    }

    @media (max-width: 640px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .toggle-row,
      .scrubber {
        flex-wrap: wrap;
      }

      svg {
        min-height: 440px;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <main class="map-shell">
      <div class="header">
        <div class="header-copy">
          <span class="eyebrow">Night Lab 003</span>
          <h1>Threshold Atlas</h1>
          <p>Watch unstable directions accumulate enough confidence and recurrence to justify a move.</p>
        </div>

        <div class="control-stack">
          <div class="toggle-row" id="viewToggle">
            <button class="toggle active" data-view="map">map</button>
            <button class="toggle" data-view="focus">focus</button>
            <button class="toggle" data-view="pressure">pressure</button>
          </div>
          <div class="scrubber" id="timeToggle">
            <button class="toggle" data-time="jan">jan</button>
            <button class="toggle" data-time="feb">feb</button>
            <button class="toggle active" data-time="mar">mar</button>
            <button class="toggle" data-time="all">all</button>
          </div>
        </div>
      </div>

      <section class="metrics" id="metrics"></section>

      <section class="map-stage">
        <div class="stage-head">
          <h2 id="mapTitle">Field map</h2>
          <span class="mini-note" id="mapNote">confidence × recurrence</span>
        </div>
        <div class="map-wrap">
          <svg id="atlas" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </main>

    <aside class="ledger-shell">
      <div class="ledger-headline">
        <div>
          <span class="eyebrow">Signal ledger</span>
          <h2>Active directions</h2>
        </div>
        <p class="mini-note" id="ledgerCount">6 entries</p>
      </div>

      <div class="legend">
        <div class="legend-row"><span class="swatch" style="background: var(--accent-soft); border-color: rgba(143,106,54,0.28);"></span><span>approaching commitment</span></div>
        <div class="legend-row"><span class="swatch" style="background: var(--danger-soft); border-color: rgba(141,79,57,0.28);"></span><span>volatile / noisy</span></div>
        <div class="legend-row"><span class="swatch" style="background: var(--ok-soft); border-color: rgba(82,106,77,0.28);"></span><span>stable but still watchful</span></div>
      </div>

      <div class="ledger" id="ledger"></div>
    </aside>
  </div>

  <script>
    const signals = [
      {
        id: 's1',
        title: 'Operator memory drift',
        domain: 'cognition',
        pressure: 81,
        volatility: 34,
        cadence: 'recurring',
        summary: 'Context compounds across sessions, but retrieval still depends on explicit structure and review habits.',
        threshold: 'Archive into operational memory before decisions start repeating.',
        notes: 'High recurrence, medium clarity, strong downstream leverage.',
        state: 'approaching',
        trace: [
          { month: 'jan', x: 40, y: 38 },
          { month: 'feb', x: 49, y: 51 },
          { month: 'mar', x: 58, y: 72 }
        ]
      },
      {
        id: 's2',
        title: 'Trust needs visible lineage',
        domain: 'verification',
        pressure: 88,
        volatility: 18,
        cadence: 'persistent',
        summary: 'Reasoning trails and proof surfaces keep returning as product gravity rather than incidental detail.',
        threshold: 'Promote when the lineage surface becomes portable and reusable.',
        notes: 'Strong thread, but already explored in prior builds.',
        state: 'stable',
        trace: [
          { month: 'jan', x: 56, y: 40 },
          { month: 'feb', x: 69, y: 61 },
          { month: 'mar', x: 76, y: 78 }
        ]
      },
      {
        id: 's3',
        title: 'Thresholds before certainty',
        domain: 'time',
        pressure: 74,
        volatility: 42,
        cadence: 'emerging',
        summary: 'Action often happens under uncertainty, but most tools hide the pre-commitment state instead of shaping it.',
        threshold: 'Clarify the language of pressure, recurrence, and partial evidence.',
        notes: 'This build explores the signal directly.',
        state: 'approaching',
        trace: [
          { month: 'jan', x: 33, y: 28 },
          { month: 'feb', x: 55, y: 44 },
          { month: 'mar', x: 69, y: 57 }
        ]
      },
      {
        id: 's4',
        title: 'Color as structural cue',
        domain: 'art direction',
        pressure: 61,
        volatility: 24,
        cadence: 'recurring',
        summary: 'Selective color can clarify temperature and conceptual difference without breaking tone.',
        threshold: 'Establish when color is structural instead of ornamental.',
        notes: 'Useful as a systems rule, not a decorative exception.',
        state: 'stable',
        trace: [
          { month: 'jan', x: 48, y: 31 },
          { month: 'feb', x: 56, y: 39 },
          { month: 'mar', x: 63, y: 48 }
        ]
      },
      {
        id: 's5',
        title: 'Playful rigor',
        domain: 'expression',
        pressure: 45,
        volatility: 56,
        cadence: 'intermittent',
        summary: 'There is room for quieter mischief and ambiguity, but it still needs a strong mechanism to avoid dissolving into mood alone.',
        threshold: 'Pair play with a rule tight enough to hold shape.',
        notes: 'Interesting, but not yet stable.',
        state: 'volatile',
        trace: [
          { month: 'jan', x: 22, y: 22 },
          { month: 'feb', x: 54, y: 35 },
          { month: 'mar', x: 47, y: 43 }
        ]
      },
      {
        id: 's6',
        title: 'Topology for human sensemaking',
        domain: 'math visualization',
        pressure: 67,
        volatility: 39,
        cadence: 'emerging',
        summary: 'Formal structures like fields, crossings, and shape could yield more surprising interfaces than standard cards and dashboards.',
        threshold: 'Find a human use case where geometry does real conceptual work.',
        notes: 'Strong frontier for future builds.',
        state: 'approaching',
        trace: [
          { month: 'jan', x: 18, y: 26 },
          { month: 'feb', x: 37, y: 49 },
          { month: 'mar', x: 55, y: 61 }
        ]
      }
    ];

    const stateStyles = {
      approaching: { stroke: 'var(--accent)', fill: 'var(--accent-soft)' },
      volatile: { stroke: 'var(--danger)', fill: 'var(--danger-soft)' },
      stable: { stroke: 'var(--ok)', fill: 'var(--ok-soft)' }
    };

    const PLOT = { left: 110, right: 980, top: 90, bottom: 640 };
    const THRESHOLD_VALUE = 65;

    let activeId = 's3';
    let view = 'map';
    let timeMode = 'mar';

    const metricsEl = document.getElementById('metrics');
    const ledgerEl = document.getElementById('ledger');
    const atlasEl = document.getElementById('atlas');
    const mapTitleEl = document.getElementById('mapTitle');
    const mapNoteEl = document.getElementById('mapNote');
    const ledgerCountEl = document.getElementById('ledgerCount');
    const toggleRoot = document.getElementById('viewToggle');
    const timeRoot = document.getElementById('timeToggle');

    function avg(values) {
      return Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
    }

    function xScale(value) {
      return PLOT.left + (value / 100) * (PLOT.right - PLOT.left);
    }

    function yScale(value) {
      return PLOT.bottom - (value / 100) * (PLOT.bottom - PLOT.top);
    }

    function point(step) {
      return { px: xScale(step.x), py: yScale(step.y) };
    }

    function getMetrics() {
      const urgent = signals.filter((signal) => signal.pressure >= 70).length;
      return [
        {
          label: 'signals tracked',
          value: String(signals.length).padStart(2, '0'),
          note: 'A small field with enough variation to reveal pressure and drift.'
        },
        {
          label: 'avg threshold pressure',
          value: `${avg(signals.map(signal => signal.pressure))}%`,
          note: 'How close the current field is to demanding an actual move.'
        },
        {
          label: 'urgent crossings',
          value: String(urgent).padStart(2, '0'),
          note: 'Signals already nearing the zone where delay becomes costly.'
        },
        {
          label: 'volatile threads',
          value: String(signals.filter(signal => signal.state === 'volatile').length).padStart(2, '0'),
          note: 'Interesting directions still too unstable to trust without more evidence.'
        }
      ];
    }

    function renderMetrics() {
      metricsEl.innerHTML = getMetrics().map(metric => `
        <article class="metric">
          <span class="metric-label">${metric.label}</span>
          <strong class="metric-value">${metric.value}</strong>
          <p class="metric-note">${metric.note}</p>
        </article>
      `).join('');
    }

    function renderLedger() {
      ledgerCountEl.textContent = `${signals.length} entries`;
      ledgerEl.innerHTML = signals.map(signal => `
        <article class="ledger-entry ${signal.id === activeId ? 'active' : ''}" data-id="${signal.id}">
          <div class="ledger-entry-inner">
            <div class="ledger-head">
              <span>${signal.domain}</span>
              <span>${signal.cadence}</span>
            </div>
            <div>
              <strong>${signal.title}</strong>
            </div>
            <p>${signal.summary}</p>
            <div class="chips">
              <span class="chip">pressure ${signal.pressure}</span>
              <span class="chip">volatility ${signal.volatility}</span>
              <span class="chip">${signal.state}</span>
            </div>
            ${signal.id === activeId ? `
              <div class="detail">
                <div class="detail-card"><span>threshold</span><p>${signal.threshold}</p></div>
                <div class="detail-card"><span>notes</span><p>${signal.notes}</p></div>
              </div>
            ` : ''}
          </div>
        </article>
      `).join('');

      ledgerEl.querySelectorAll('.ledger-entry').forEach(entry => {
        entry.addEventListener('click', () => {
          activeId = entry.dataset.id;
          renderLedger();
          renderAtlas();
        });
      });
    }

    function tracePath(signal, mode) {
      const steps = mode === 'all' ? signal.trace : signal.trace.filter(step => step.month === mode);
      return steps
        .map((step, index) => {
          const { px, py } = point(step);
          return `${index === 0 ? 'M' : 'L'} ${px} ${py}`;
        })
        .join(' ');
    }

    function getCurrentStep(signal) {
      if (timeMode === 'all') return signal.trace[signal.trace.length - 1];
      return signal.trace.find(step => step.month === timeMode) || signal.trace[signal.trace.length - 1];
    }

    function renderAtlas() {
      const active = signals.find(signal => signal.id === activeId);
      const timeLabel = timeMode === 'all' ? 'full trace' : `${timeMode} snapshot`;
      const titleMap = {
        map: ['Field map', `confidence × recurrence · ${timeLabel}`],
        focus: [`Focus: ${active.title}`, `selected signal enlarged · ${timeLabel}`],
        pressure: ['Pressure map', `threshold line emphasized · ${timeLabel}`]
      };
      mapTitleEl.textContent = titleMap[view][0];
      mapNoteEl.textContent = titleMap[view][1];

      const thresholdY = yScale(THRESHOLD_VALUE);
      const thresholdStroke = view === 'pressure' ? 'rgba(17,17,17,0.36)' : 'rgba(17,17,17,0.22)';
      const visibleSignals = view === 'focus'
        ? [active, ...signals.filter(signal => signal.id !== activeId).slice(0, 3)]
        : signals;

      atlasEl.innerHTML = `
        <rect class="band" x="${PLOT.left}" y="${PLOT.top}" width="${PLOT.right - PLOT.left}" height="170"></rect>
        <rect class="band" x="${PLOT.left}" y="${PLOT.top + 170}" width="${PLOT.right - PLOT.left}" height="180" style="fill: rgba(17,17,17,0.018)"></rect>
        <rect class="band" x="${PLOT.left}" y="${PLOT.top + 350}" width="${PLOT.right - PLOT.left}" height="200" style="fill: rgba(17,17,17,0.028)"></rect>

        ${[0, 20, 40, 60, 80, 100].map(value => `<line class="grid-line" x1="${xScale(value)}" y1="${PLOT.top}" x2="${xScale(value)}" y2="${PLOT.bottom}"></line>`).join('')}
        ${[0, 25, 50, 75, 100].map(value => `<line class="grid-line" x1="${PLOT.left}" y1="${yScale(value)}" x2="${PLOT.right}" y2="${yScale(value)}"></line>`).join('')}

        <line class="threshold-line" x1="${PLOT.left}" y1="${thresholdY}" x2="${PLOT.right}" y2="${thresholdY}" style="stroke:${thresholdStroke}"></line>
        <text class="axis-label" x="${PLOT.left + 8}" y="${thresholdY - 10}">commitment threshold</text>
        <text class="axis-label" x="${PLOT.left}" y="680">low confidence</text>
        <text class="axis-label" x="${PLOT.right - 86}" y="680">high confidence</text>
        <text class="axis-label" x="24" y="${PLOT.bottom}" transform="rotate(-90 24 ${PLOT.bottom})">low recurrence</text>
        <text class="axis-label" x="24" y="${PLOT.top + 10}" transform="rotate(-90 24 ${PLOT.top + 10})">high recurrence</text>

        ${visibleSignals.map(signal => {
          const currentStep = getCurrentStep(signal);
          const current = point(currentStep);
          const style = stateStyles[signal.state];
          const isActive = signal.id === activeId;
          const path = tracePath(signal, timeMode);
          const historicalDots = timeMode === 'all'
            ? signal.trace.slice(0, -1).map(step => {
                const { px, py } = point(step);
                return `<circle cx="${px}" cy="${py}" r="${isActive ? 4.2 : 3.4}" fill="${style.stroke}" opacity="${isActive ? 0.42 : 0.18}"></circle>`;
              }).join('')
            : '';
          return `
            ${path ? `<path class="link" d="${path}" style="stroke:${style.stroke}; opacity:${isActive || view !== 'focus' ? 0.55 : 0.18}; stroke-width:${isActive ? 2.2 : 1.2}"></path>` : ''}
            ${historicalDots}
            <g class="node ${isActive ? 'active-node' : ''}" data-id="${signal.id}" style="opacity:${view === 'focus' && !isActive ? 0.34 : 1}">
              <circle class="core" cx="${current.px}" cy="${current.py}" r="${isActive ? 13 : 10}" stroke="${style.stroke}" fill="${style.fill}"></circle>
              <text x="${current.px + 18}" y="${current.py - 2}" font-weight="500">${signal.title}</text>
              <text class="sub" x="${current.px + 18}" y="${current.py + 15}">${signal.domain} · ${timeMode === 'all' ? `pressure ${signal.pressure}` : currentStep.month}</text>
            </g>
          `;
        }).join('')}
      `;

      atlasEl.querySelectorAll('.node').forEach(node => {
        node.addEventListener('click', () => {
          activeId = node.dataset.id;
          renderLedger();
          renderAtlas();
        });
      });
    }

    toggleRoot.querySelectorAll('.toggle').forEach(button => {
      button.addEventListener('click', () => {
        view = button.dataset.view;
        toggleRoot.querySelectorAll('.toggle').forEach(btn => btn.classList.toggle('active', btn === button));
        renderAtlas();
      });
    });

    timeRoot.querySelectorAll('.toggle').forEach(button => {
      button.addEventListener('click', () => {
        timeMode = button.dataset.time;
        timeRoot.querySelectorAll('.toggle').forEach(btn => btn.classList.toggle('active', btn === button));
        renderAtlas();
      });
    });

    renderMetrics();
    renderLedger();
    renderAtlas();
  </script>
</body>
</html>
